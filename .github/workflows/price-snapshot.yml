name: Price snapshot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch price snapshot
        run: npx tsx scripts/fetch-price-snapshot.ts

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/snapshots/prices-latest.json; then
            git add public/snapshots/prices-latest.json
            git commit -m "chore: update price snapshot"
            git push
          else
            echo "No change in price snapshot; skipping commit."
          fi
