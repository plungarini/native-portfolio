name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # Dummy value, not the real secret: tests mock `fetch` and never hit
          # the network, but assert on SOLANA_RPC_HOSTS having 2 entries
          # (Helius primary + publicnode fallback) for host-rotation coverage.
          # Using a placeholder (not `secrets.VITE_HELIUS_API_KEY`) keeps CI
          # green on fork PRs too, since GitHub withholds secrets from those.
          VITE_HELIUS_API_KEY: ci-placeholder-key

      - name: Build
        run: npm run build
        env:
          VITE_HELIUS_API_KEY: ${{ secrets.VITE_HELIUS_API_KEY }}
